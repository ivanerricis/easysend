# Full nginx configuration for the unprivileged web container (listens on 8080).
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  # Writable paths for the non-root user (the root filesystem is read-only).
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Access log without client IPs, referers or user agents, and without secrets in the URL:
  # download tokens (/api/downloads/<token>, /d/<token>) are masked and query strings dropped.
  map $request_uri $loggable_uri {
    default                                  $request_uri;
    ~^(?<p_dl>/api/downloads/)[^/?]+(?<r_dl>[^?]*) "${p_dl}[token]${r_dl}";
    ~^(?<p_pg>/d/)[^/?]+(?<r_pg>[^?]*)       "${p_pg}[token]${r_pg}";
    ~^(?<p_q>[^?]*)\?                      $p_q;
  }

  log_format easysend '$time_iso8601 "$request_method $loggable_uri" $status $body_bytes_sent '
                      '$request_time';
  access_log /dev/stdout easysend;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

  # Keep the proto set by an upstream proxy (cloudflared), fall back to our own scheme.
  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Re-resolve the api container after restarts (a static upstream would pin the old IP).
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_upstream http://api:3000;

    client_max_body_size 1m;
    client_body_timeout 60s;

    # Container healthcheck; independent of the api.
    location = /nginx-health {
      access_log off;
      default_type text/plain;
      return 200 "ok";
    }

    location = /health {
      include /etc/nginx/security-headers.conf;
      include /etc/nginx/proxy-headers.conf;
      proxy_hide_header Content-Security-Policy;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Referrer-Policy;
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header Permissions-Policy;
      proxy_pass $api_upstream/api/health;
    }

    # tus uploads: chunks of up to 50 MB (Cloudflare caps requests at 100 MB), streamed to the api.
    location /api/uploads {
      include /etc/nginx/security-headers.conf;
      include /etc/nginx/proxy-headers.conf;
      proxy_hide_header Content-Security-Policy;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Referrer-Policy;
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header Permissions-Policy;
      client_max_body_size 50m;
      proxy_request_buffering off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_pass $api_upstream;
    }

    # Downloads and zip streams: no buffering, long timeouts.
    location /api/downloads/ {
      include /etc/nginx/security-headers.conf;
      include /etc/nginx/proxy-headers.conf;
      proxy_hide_header Content-Security-Policy;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Referrer-Policy;
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header Permissions-Policy;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_pass $api_upstream;
    }

    # Everything else under /api. 4m leaves room for branding uploads (BRANDING_MAX_BYTES = 2 MB).
    location /api/ {
      include /etc/nginx/security-headers.conf;
      include /etc/nginx/proxy-headers.conf;
      proxy_hide_header Content-Security-Policy;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Referrer-Policy;
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header Permissions-Policy;
      client_max_body_size 4m;
      proxy_pass $api_upstream;
    }

    # Hashed build output: cache for a year.
    location /assets/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    location = /theme-init.js {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache";
    }

    location = /index.html {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache";
    }

    # SPA fallback.
    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache";
      try_files $uri /index.html;
    }
  }
}
