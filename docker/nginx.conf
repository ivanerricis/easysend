# Full nginx configuration for the unprivileged web container (listens on 8080).
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  # Writable paths for the non-root user (the root filesystem is read-only).
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  access_log /dev/stdout;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

  # Keep the proto set by an upstream proxy (cloudflared), fall back to our own scheme.
  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Re-resolve the api container after restarts (a static upstream would pin the old IP).
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_upstream http://api:3000;

    client_max_body_size 1m;

    # Container healthcheck; independent of the api.
    location = /nginx-health {
      access_log off;
      default_type text/plain;
      return 200 "ok";
    }

    location = /health {
      include /etc/nginx/security-headers.conf;
      include /etc/nginx/proxy-headers.conf;
      proxy_pass $api_upstream/api/health;
    }

    # tus uploads: chunks of up to 50 MB (Cloudflare caps requests at 100 MB), streamed to the api.
    location /api/uploads {
      include /etc/nginx/security-headers.conf;
      include /etc/nginx/proxy-headers.conf;
      client_max_body_size 50m;
      proxy_request_buffering off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_pass $api_upstream;
    }

    # Downloads and zip streams: no buffering, long timeouts.
    location /api/downloads/ {
      include /etc/nginx/security-headers.conf;
      include /etc/nginx/proxy-headers.conf;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_pass $api_upstream;
    }

    # Everything else under /api. 4m leaves room for branding uploads (BRANDING_MAX_BYTES = 2 MB).
    location /api/ {
      include /etc/nginx/security-headers.conf;
      include /etc/nginx/proxy-headers.conf;
      client_max_body_size 4m;
      proxy_pass $api_upstream;
    }

    # Hashed build output: cache for a year.
    location /assets/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    location = /theme-init.js {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache";
    }

    location = /index.html {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache";
    }

    # SPA fallback.
    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache";
      try_files $uri /index.html;
    }
  }
}
