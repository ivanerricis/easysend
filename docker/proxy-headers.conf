# Included by every location that proxies to the api: forwarding headers, and the security
# headers helmet already sets (hidden here so each one reaches the client once, from
# security-headers.conf).
# Forwarding headers for the api. XFF is appended to (Cloudflare and cloudflared add
# their hops before us); Express "trust proxy" counts the hops. CF-Connecting-IP and
# any other client headers are passed through unchanged by nginx's default behaviour.
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Forwarded-Host $http_host;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Permissions-Policy;
