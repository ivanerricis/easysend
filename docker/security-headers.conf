# Included in every location that sets its own add_header (nginx drops inherited
# add_header directives as soon as a location defines one).
# style-src-attr 'unsafe-inline': Radix UI sets inline style attributes; stylesheets stay external-only.
# style-src hash: SHA-256 of the empty string, for the empty <style> element input-otp creates before
# adding its rules with insertRule (CSSOM, not blocked). No other inline stylesheet is allowed.
# No HSTS here: Cloudflare terminates TLS, and browsers ignore HSTS over plain HTTP.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'sha256-47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU='; style-src-attr 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# strict-origin-when-cross-origin keeps same-origin referrers working for the app while
# leaking only the origin (never the path with the download token) to other sites.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
