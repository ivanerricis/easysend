# Local try-out on a dev PC (see scripts/local.mjs). Combine with docker-compose.yml and
# docker-compose.override.yml. cloudflared is never started here (its profile is not enabled).

services:
  api:
    environment:
      APP_MODE: local
      PUBLIC_URL: http://localhost:${LOCAL_WEB_PORT:-8080}
      TRUST_PROXY: 1
      LOG_LEVEL: debug
      SMTP_DEV_HOST: mailpit
      SMTP_DEV_PORT: 1025
    # Named volume instead of the ./updates bind mount: no folder is created in the repository.
    volumes:
      - easysend-updates:/updates

  web:
    ports: !override
      - '127.0.0.1:${LOCAL_WEB_PORT:-8080}:8080'

  mailpit:
    image: axllent/mailpit:v1.32.0
    restart: unless-stopped
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    security_opt:
      - no-new-privileges:true
    ports:
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'

volumes:
  easysend-updates:
