name: Bug report
description: Report something that does not work as expected
labels: [fix]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is the problem?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit SHA
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local (Docker Desktop, APP_MODE=local)
        - Production
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: 'Relevant log output. WARNING: remove any secrets, tokens, passwords, keys and personal data before pasting.'
      render: shell
