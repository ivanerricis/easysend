name: Release Please

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # The release PR is created with GITHUB_TOKEN, so GitHub queues its CI run
      # as "action required". Before merging the release, approve that run from
      # the PR ("Approve workflows to run") or with
      # `gh api -X POST repos/<owner>/<repo>/actions/runs/<id>/approve`.
