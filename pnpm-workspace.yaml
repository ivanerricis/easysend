packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true

catalog:
  # tooling
  '@eslint/js': 10.0.1
  '@types/node': 26.6.5
  eslint: 10.13.0
  eslint-plugin-jsx-a11y: 6.10.2
  eslint-plugin-react-hooks: 7.1.1
  globals: 17.13.0
  prettier: 3.9.10
  tsx: 4.23.15
  typescript: 6.0.3
  typescript-eslint: 8.71.2
  vitest: 5.0.5
  # shared / api
  zod: 4.6.7
  express: 5.3.0
  pino: 10.4.0
  pino-http: 11.0.0
  pino-pretty: 13.2.0
  helmet: 8.3.0
  drizzle-orm: 0.45.4
  drizzle-kit: 0.31.11
  better-sqlite3: 13.0.3
  tsdown: 0.23.1
  supertest: 7.3.1
  '@types/express': 5.0.6
  '@types/supertest': 7.2.1
  '@types/better-sqlite3': 9.6.0
  # web
  class-variance-authority: 0.7.1
  cn: 0.5.0
  radix-ui: 1.8.1
  shadcn: 4.22.1
  tw-animate-css: 1.4.0
  lucide-react: 1.59.0
  react: 19.3.1
  react-dom: 19.3.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  vite: 8.3.4
  '@vitejs/plugin-react': 6.1.2
  tailwindcss: 4.3.3
  '@tailwindcss/vite': 4.3.3
  i18next: 26.5.2
  react-i18next: 17.1.0
  '@fontsource/ibm-plex-sans': 5.3.0
  '@fontsource/ibm-plex-mono': 5.3.0
  jsdom: 30.1.3
  '@testing-library/react': 16.3.3
  '@testing-library/jest-dom': 7.0.1
  '@testing-library/dom': 10.4.2

# shadcn 4.22.1 is younger than the minimum release age
minimumReleaseAgeExclude:
  - shadcn@4.22.1

# eslint-plugin-jsx-a11y 6.10.2 declares peer eslint up to ^9 but works with ESLint 10
peerDependencyRules:
  allowedVersions:
    eslint-plugin-jsx-a11y>eslint: '10'
