# Redis lockers of @tus/server and @tus/file-store: optional, never used (file store only).
ignoredOptionalDependencies:
  - '@redis/client'
  - ioredis

# eslint-plugin-jsx-a11y 6.10.2 declares peer eslint up to ^9 but works with ESLint 10
peerDependencyRules:
  allowedVersions:
    eslint-plugin-jsx-a11y>eslint: '10'
