packages:
  - apps/*
  - packages/*
  - e2e
  - docs

allowBuilds:
  esbuild: true

# Advisories without a fixed version that never reach the images:
# GHSA-vfj7-8cjw-p6xm (braces) comes in through the shadcn CLI, used only at build time.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm

# VitePress 1.x (docs site) still asks for vite 5, which no longer gets security fixes: run it on
# vite 6 instead. The app itself uses vite 8. Drop this with VitePress 2.
overrides:
  'vitepress>vite': 6.4.4

catalog:
  # tooling
  '@eslint/js': 10.0.1
  '@types/node': 26.6.5
  eslint: 10.13.0
  eslint-plugin-jsx-a11y: 6.10.2
  eslint-plugin-react-hooks: 7.1.1
  globals: 17.13.0
  prettier: 3.9.10
  tsx: 4.23.15
  typescript: 6.0.3
  typescript-eslint: 8.72.0
  vitest: 5.0.5
  # shared / api
  zod: 4.6.7
  express: 5.3.0
  pino: 10.4.0
  pino-http: 11.0.0
  pino-pretty: 13.2.0
  helmet: 8.3.0
  drizzle-orm: 0.45.4
  drizzle-kit: 0.31.11
  better-sqlite3: 13.0.3
  tsdown: 0.23.2
  supertest: 7.3.1
  '@types/express': 5.0.6
  '@types/supertest': 7.2.1
  '@types/better-sqlite3': 9.6.0
  '@node-rs/argon2': 2.2.2
  otpauth: 9.5.2
  rate-limiter-flexible: 11.2.3
  cookie: 2.0.1
  nodemailer: 10.2.1
  '@tus/server': 2.4.6
  '@tus/file-store': 2.1.1
  node-cron: 4.6.0
  yazl: 3.3.1
  '@types/yazl': 3.3.1
  yauzl: 3.4.0
  '@types/yauzl': 3.4.0
  sharp: 0.35.5
  # web
  class-variance-authority: 0.7.1
  cn: 0.5.0
  radix-ui: 1.8.1
  shadcn: 4.22.1
  tw-animate-css: 1.4.0
  lucide-react: 1.61.0
  react: 19.3.1
  react-dom: 19.3.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  vite: 8.3.5
  '@vitejs/plugin-react': 6.1.2
  tailwindcss: 4.3.3
  '@tailwindcss/vite': 4.3.3
  i18next: 26.5.7
  react-i18next: 17.1.4
  '@fontsource/ibm-plex-sans': 5.3.0
  '@fontsource-variable/plus-jakarta-sans': 5.3.0
  '@fontsource-variable/jetbrains-mono': 5.3.0
  jsdom: 30.1.3
  '@testing-library/react': 16.3.3
  '@testing-library/jest-dom': 7.0.1
  '@testing-library/dom': 10.4.2
  react-router: 8.5.0
  '@tanstack/react-query': 5.104.5
  react-hook-form: 7.90.0
  '@hookform/resolvers': 5.9.1
  tus-js-client: 4.3.1
  input-otp: 1.5.0
  sonner: 2.0.8
  uqr: 0.1.3
  # docs (GitHub Pages site)
  vitepress: 1.6.4
  # e2e (screenshots and axe, phase 5; full E2E in phase 6)
  '@playwright/test': 1.64.1
  '@axe-core/playwright': 4.14.0

# Redis lockers of @tus/server and @tus/file-store: optional, never used (file store only).
ignoredOptionalDependencies:
  - '@redis/client'
  - ioredis

# eslint-plugin-jsx-a11y 6.10.2 declares peer eslint up to ^9 but works with ESLint 10
peerDependencyRules:
  allowedVersions:
    eslint-plugin-jsx-a11y>eslint: '10'
